name: Publish fixed DOBOVYK 1.4
on:
  push:
    paths: ['.github/workflows/publish-fixed-1.4.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -L --fail 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-0260-8210-9412-e9694ad142ad/raw?se=2026-10-01T20%3A15%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=e33c4e1c-a164-54ab-b123-10723160b321&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T15%3A30%3A55Z&ske=2026-10-02T15%3A30%3A55Z&sks=b&skv=2026-02-06&sig=QqEtsvSxTbMB1Bx%2BBcEc7DVkfBnPyFAj2BM8bN08erI%3D' -o artifact.zip
          unzip -o artifact.zip -d artifact
          APK="$(find artifact -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" DOBOVYK-1.4-live.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DOBOVYK-1.4-live.apk
          git commit -m "Update DOBOVYK 1.4 with wallpaper compass fix"
          git push

# trigger
