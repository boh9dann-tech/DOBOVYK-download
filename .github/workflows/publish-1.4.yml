name: Publish DOBOVYK 1.4
on:
  push:
    paths:
      - '.github/workflows/publish-1.4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download APK artifact
        run: |
          curl -L --fail 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-cfa8-8210-b019-3b46cfbd726f/raw?se=2026-10-01T20%3A00%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=c80c6a79-39e8-5b65-a643-d2c7fc6b6ba2&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T11%3A19%3A39Z&ske=2026-10-02T11%3A19%3A39Z&sks=b&skv=2026-02-06&sig=JtcbyyzczSUwaEdYqINBt0YgsNoQP1R%2BrEM5Bb9VGDw%3D' -o artifact.zip
          unzip -o artifact.zip -d artifact
          APK="$(find artifact -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" DOBOVYK-1.4-live.apk
      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DOBOVYK-1.4-live.apk
          git commit -m "Publish DOBOVYK 1.4 APK" || exit 0
          git push
